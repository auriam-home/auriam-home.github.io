name: Pages pour Google

on:
  schedule:
    - cron: '30 3 * * *'   # chaque nuit
  workflow_dispatch:        # bouton « Run workflow » (mise à jour immédiate)

permissions:
  contents: write
  pages: write

concurrency:
  group: seo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Générer les pages
        run: node scripts/build-seo.mjs
      - name: Enregistrer si changement
        run: |
          git config user.name "auriam-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A produits categories catalogue sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour des pages Google"
            git push
          fi
      - name: Relancer la publication du site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
